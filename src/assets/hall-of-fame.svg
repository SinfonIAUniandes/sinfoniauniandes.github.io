<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 594 130" role="img" aria-labelledby="hall-title hall-description">
  <title id="hall-title">Hall of Fame</title>
  <desc id="hall-description">Golden Hall of Fame wordmark drawn in the SINFONiA lettering style.</desc>

  <style>
    @keyframes trace-border {
      from { stroke-dashoffset: 1.01; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes fill-in {
      from { fill-opacity: 0; }
      to { fill-opacity: 1; }
    }

    .border {
      fill: none;
      stroke: rgb(196,160,39);
      stroke-dasharray: 1.01;
      stroke-dashoffset: 1.01;
      stroke-linecap: butt;
      stroke-linejoin: round;
      animation: trace-border 0.111111s ease-in both;
    }

    .letter {
      fill-opacity: 0;
      animation: fill-in 0.027778s linear 0.111111s both;
    }

    .border-1 { animation-delay: 0s; }
    .border-2 { animation-delay: 0.044s; }
    .border-3 { animation-delay: 0.088s; }
    .border-4 { animation-delay: 0.132s; }
    .border-5 { animation-delay: 0.176s; }
    .border-6 { animation-delay: 0.22s; }
    .border-7 { animation-delay: 0.264s; }
    .border-8 { animation-delay: 0.308s; }
    .border-9 { animation-delay: 0.352s; }
    .border-10 { animation-delay: 0.396s; }
    .letter-1 { animation-delay: 0.1s; }
    .letter-2 { animation-delay: 0.144s; }
    .letter-3 { animation-delay: 0.188s; }
    .letter-4 { animation-delay: 0.232s; }
    .letter-5 { animation-delay: 0.276s; }
    .letter-6 { animation-delay: 0.32s; }
    .letter-7 { animation-delay: 0.364s; }
    .letter-8 { animation-delay: 0.408s; }
    .letter-9 { animation-delay: 0.452s; }
    .letter-10 { animation-delay: 0.496s; }

    @media (prefers-reduced-motion: reduce) {
      .border { animation: none; stroke-dashoffset: 0; }
      .letter { animation: none; fill-opacity: 1; }
    }
  </style>

